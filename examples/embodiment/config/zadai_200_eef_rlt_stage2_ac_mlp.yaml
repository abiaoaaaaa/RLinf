defaults:
  # Reuse scheduling, replay, logging, and placement from the verified joint
  # Stage 2 configuration. Only action/state semantics are overridden here.
  - zadai_200_rlt_stage2_ac_mlp
  - _self_

runner:
  logger:
    experiment_name: "zadai_200_eef_rlt_stage2_ac_mlp"

algorithm:
  actor_action_constraint:
    # The environment and VLAHost already enforce physical per-step limits.
    # A second normalized-space projection here caused chunk-boundary snaps
    # when the measured pose lagged the previous command.
    enable: False
    action_space: eef
    constrained_steps: 1
    # Normalized domain layout per arm: xyz(3), rot6d(6), gripper(1).
    # Grippers stay on the Stage1 reference at actor handoff.
    max_reference_delta: [0.08, 0.08, 0.08,
                          0.04, 0.04, 0.04, 0.04, 0.04, 0.04, 0.0,
                          0.08, 0.08, 0.08,
                          0.04, 0.04, 0.04, 0.04, 0.04, 0.04, 0.0]
  replay_buffer:
    # Keep online replay outside the timestamped run directory so restarts can
    # resume the same EEF buffer without copying it between log directories.
    auto_save_path: ${oc.env:ZADAI_EEF_REPLAY_BUFFER_PATH,/home/zzx23457/code_xlb/RLinf/replay_buffers/zadai_200_eef_online_workspace10cm}
  demo_buffer:
    # The current expert export contains 1,405 transitions.  The inherited
    # value of 500 would restrict sampling to only the newest 500 entries.
    cache_size: 1405
    sample_window_size: 1405
    load_path: ${oc.env:ZADAI_EEF_DEMO_BUFFER_PATH,/home/zzx23457/code_xlb/RLinf/replay_buffers/zadai_200_eef_demo_stage1_step15000_workspace10cm/rank_0}

env:
  train:
    override_cfg:
      control_space: eef
      # The dataset, Stage 1 checkpoint, and VLAHost all use the same
      # m6_696/base_link/{left_tool,right_tool} EEF frame.
      eef_policy_to_runtime_tool_offset_m: 0.0
      # Physical EEF safety is enforced after decoding the RLT action.
      max_eef_translation_delta: 0.05
      max_eef_chunk_translation_delta: 0.40
      max_eef_rotation_delta_rad: 0.20
      max_eef_angular_velocity_rad_s: 3.0
      max_eef_chunk_rotation_delta_rad: 1.50
  eval:
    override_cfg:
      control_space: eef
      # Keep evaluation in the same physical EEF frame as training and data.
      eef_policy_to_runtime_tool_offset_m: 0.0
      max_eef_translation_delta: 0.05
      max_eef_chunk_translation_delta: 0.40
      max_eef_rotation_delta_rad: 0.20
      max_eef_angular_velocity_rad_s: 3.0
      max_eef_chunk_rotation_delta_rad: 1.50

rollout:
  rlt_feature_model:
    model_path: ${oc.env:ZADAI_EEF_STAGE1_CHECKPOINT,/home/zzx23457/code_xlb/RLinf/checkpoints/zadai_200_eef_stage1_step15000/actor}
    openpi_data:
      repo_id: zadai_200_eef_rot6d
      norm_stats_path: ${oc.env:ZADAI_EEF_NORM_STATS,/home/zzx23457/Data/lerobot/zadai_200_eef_norm_stats_m6_696/norm_stats.json}
    openpi:
      config_name: pi05_zadai_eef_rot6d
      action_env_dim: 20
      rlt_action_space: eef

actor:
  model:
    proprio_dim: 20
    action_dim: 20
