defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Joint Pi0.5 + RLT Stage1 training: adapt the action expert to the new 20-D
# bilateral EEF semantics while training the RLT token encoder in the same run.
cluster:
  num_nodes: 1
  component_placement:
    # Four H100s on the training server. Each rank keeps a model replica and
    # participates in synchronous FSDP gradient reduction.
    actor: 0-3

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf-rlt
    experiment_name: "zadai_200_eef_pi05_rlt_joint_sft"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  # 15k * global_batch_size 128 = 1.92M samples, about 6.25 passes over the
  # 307,134-frame demonstration dataset; close to the original joint run's
  # effective sample exposure.
  max_steps: 15000
  val_check_interval: -1
  save_interval: 3000

data:
  train_data_paths: ${oc.env:ZADAI_EEF_DATA,/ssd/xlb/zadai_eef/data/lerobot/zadai_200_eef_rot6d_rlinf_v21}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Per optimizer step: 8 samples/GPU * 4 GPUs * 4 accumulation steps = 128.
  micro_batch_size: 8
  global_batch_size: 128
  seed: 42

  model:
    model_type: "openpi"
    precision: null
    is_lora: False
    # Always start Stage 1 from the original Pi0.5 base checkpoint. Override
    # ZADAI_PI05_INIT_CKPT only when intentionally resuming another SFT run.
    model_path: ${oc.env:ZADAI_PI05_INIT_CKPT,/ssd/xlb/code/RLinf/checkpoints/pi05_base_pytorch_bfloat16}
    num_action_chunks: 50
    action_dim: 20
    num_steps: 5

    openpi_data:
      repo_id: "zadai_200_eef_rot6d"
      norm_stats_path: ${oc.env:ZADAI_EEF_NORM_STATS,/ssd/xlb/zadai_eef/data/lerobot/zadai_200_eef_norm_stats/norm_stats.json}

    openpi:
      config_name: "pi05_zadai_eef_rot6d"
      num_images_in_input: 3
      action_horizon: 50
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      # Restrict offline VLA loss to [action_chunk, action_env_dim], excluding
      # the 12 model-padding dimensions.
      sft_use_action_chunk_loss: True
      # Full-parameter Stage 1: train the PaliGemma vision-language backbone,
      # Pi0.5 action expert, and RLT token encoder in the same optimization step.
      train_expert_only: False
      detach_critic_input: True
      use_rlt: True
      rlt_train_only: False
      # sft_forward optimizes: rlt_loss + rlt_alpha * vla_loss.
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_num_rl_tokens: 1
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_image_only: False
      rlt_use_mask: True

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1e-8
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    # A short warmup is sufficient for the 15k-step full-parameter run while
    # still protecting the newly introduced EEF/RLT heads.
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    # All model parameters are trainable, so flat-parameter FSDP is supported.
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
