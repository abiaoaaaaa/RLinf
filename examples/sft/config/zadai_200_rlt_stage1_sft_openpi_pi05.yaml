defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf-rlt
    experiment_name: "zadai_200_rlt_stage1"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  # Continue from the completed 13k checkpoint for 7k additional steps.
  # This reaches an equivalent total of 20k optimization steps.
  max_steps: 7000
  val_check_interval: -1
  save_interval: 1000

data:
  train_data_paths: "/home/xlb/data/数据存档/pi05_zadai_200_rlt_weight_data_20260825/data/zadai_200_rlinf_v21"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 16
  seed: 42

  model:
    model_type: "openpi"
    precision: null
    is_lora: False
    # Current RLT Stage 1 lives on the legacy `openpi` wrapper. Switch to the
    # 667-key checkpoint_149999_rlinf_pytorch only after porting RLT to the
    # vendored `openpi_pytorch` backend.
    model_path: "/home/xlb/code/RLinf/logs/20260825-15:36:07-zadai_200_rlt_stage1_sft_openpi_pi05/zadai_200_rlt_stage1/checkpoints/global_step_13000/actor"
    num_action_chunks: 50
    action_dim: 16
    num_steps: 5

    openpi_data:
      repo_id: "zadai_200"
      norm_stats_path: "/home/xlb/data/数据存档/pi05_zadai_200_rlt_weight_data_20260825/model/checkpoint_149999_pytorch/assets/zadai_200/norm_stats.json"

    openpi:
      config_name: "pi05_hhw_tj_zadai_200_uniform"
      num_images_in_input: 3
      action_horizon: 50
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      train_expert_only: False
      detach_critic_input: True
      use_rlt: True
      rlt_train_only: True
      rlt_alpha: 0.0
      rlt_prefix_seq_len: 1024
      rlt_image_only: False
      rlt_use_mask: True

  optim:
    lr: 1e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1e-8
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
