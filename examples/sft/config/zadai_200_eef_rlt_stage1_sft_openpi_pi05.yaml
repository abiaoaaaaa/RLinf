defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Optional compressor-only refinement after the joint SFT+encoder run. The
# Pi0.5 backbone/action expert are frozen and only the RLT token compressor is
# trained. This file is not required for the default joint-training workflow.
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf-rlt
    experiment_name: "zadai_200_eef_rlt_stage1"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 10000
  val_check_interval: -1
  save_interval: 1000

data:
  train_data_paths: ${oc.env:ZADAI_EEF_DATA,/home/zzx23457/Data/lerobot/zadai_200_eef_rot6d_rlinf_v21}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 16
  seed: 42

  model:
    model_type: "openpi"
    precision: null
    is_lora: False
    # Point this to an EEF joint-SFT actor checkpoint, not the old joint-action
    # Stage1 checkpoint.
    model_path: ${oc.env:ZADAI_EEF_SFT_CKPT}
    num_action_chunks: 50
    action_dim: 20
    num_steps: 5

    openpi_data:
      repo_id: "zadai_200_eef_rot6d"
      norm_stats_path: ${oc.env:ZADAI_EEF_NORM_STATS,/home/zzx23457/Data/lerobot/zadai_200_eef_norm_stats/norm_stats.json}

    openpi:
      config_name: "pi05_zadai_eef_rot6d"
      num_images_in_input: 3
      action_horizon: 50
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      sft_use_action_chunk_loss: True
      train_expert_only: False
      detach_critic_input: True
      use_rlt: True
      rlt_train_only: True
      rlt_alpha: 0.0
      rlt_prefix_seq_len: 1024
      rlt_image_only: False
      rlt_use_mask: True

  optim:
    lr: 1e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1e-8
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
